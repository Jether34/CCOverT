services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  model:
    build:
      context: .
      dockerfile: services/model-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MODEL_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN:?MODEL_SERVICE_TOKEN must be set}
      MODEL_ALLOW_DEMO_PROFILE: ${MODEL_ALLOW_DEMO_PROFILE:-false}
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      model:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      MONGODB_URI: mongodb://mongo:27017/ccover_t
      USE_MEMORY_DB: "false"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      DEV_VERIFICATION_ENABLED: ${DEV_VERIFICATION_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MODEL_SERVICE_URL: http://model:8000
      MODEL_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN:?MODEL_SERVICE_TOKEN must be set}
      ALLOW_DEMO_PROFILE: ${ALLOW_DEMO_PROFILE:-false}
      MODEL_ALLOW_DEMO_PROFILE: ${MODEL_ALLOW_DEMO_PROFILE:-false}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:?RECAPTCHA_SITE_KEY must be set}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:?RECAPTCHA_SECRET_KEY must be set}
      RECAPTCHA_REQUIRED: ${RECAPTCHA_REQUIRED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-}
      ENVIRONMENTAL_PROVIDER: ${ENVIRONMENTAL_PROVIDER:-disabled}
      ENVIRONMENTAL_PROVIDER_URL: ${ENVIRONMENTAL_PROVIDER_URL:-}
      ENVIRONMENTAL_PROVIDER_API_KEY: ${ENVIRONMENTAL_PROVIDER_API_KEY:-}
      REEF_STATIONS_JSON: ${REEF_STATIONS_JSON:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-365}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      BOOTSTRAP_RESEARCHER_EMAILS: ${BOOTSTRAP_RESEARCHER_EMAILS:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_RESEARCHER_PASSWORD: ${BOOTSTRAP_RESEARCHER_PASSWORD:-}
    expose:
      - "4000"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?VITE_RECAPTCHA_SITE_KEY must be set}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:

networks:
  edge:
  backend:
    internal: true
